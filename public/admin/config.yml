backend:
  name: git-gateway
  branch: main

# Esto activa el login mediante Netlify Identity — se configura al conectar el sitio a Netlify.
publish_mode: simple
media_folder: "public/images/blog"
public_folder: "/images/blog"

collections:
  - name: "blog"
    label: "Blog"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    extension: "md"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Descripción (para SEO)", name: "description", widget: "text" }
      - { label: "Fecha de publicación", name: "date", widget: "datetime" }
      - { label: "Imagen destacada", name: "image", widget: "image", required: false }
      - { label: "Borrador (no publicar aún)", name: "draft", widget: "boolean", default: false, required: false }
      - { label: "Contenido", name: "body", widget: "markdown" }

  - name: "talleres"
    label: "Talleres"
    folder: "src/content/talleres"
    create: true
    slug: "{{fields.fecha}}-{{slug}}"
    extension: "md"
    summary: "{{fecha}} — {{titulo}}"
    fields:
      - { label: "Título del taller", name: "titulo", widget: "string" }
      - { label: "Fecha", name: "fecha", widget: "date", format: "YYYY-MM-DD" }
      - { label: "Precio (COP, solo el número, sin puntos)", name: "precio", widget: "number", value_type: "int" }
      - { label: "Nota junto al precio", name: "notaPrecio", widget: "string", default: "todo incluido", hint: "Ej: 'todo incluido' o 'descuentos para grupos'" }
      - { label: "Duración (ej: 2 horas)", name: "duracion", widget: "string", required: false }
      - { label: "Horario", name: "horario", widget: "string", required: false, hint: "Ej: '9:00 a. m.–1:00 p. m. y 2:00 p. m.–6:00 p. m.', o 'Escríbenos por WhatsApp para confirmar disponibilidad'" }
      - { label: "Descripción", name: "descripcion", widget: "text" }
      - { label: "Qué incluye", name: "incluye", widget: "list" }
      - { label: "Lugar", name: "lugar", widget: "string", default: "Calle 155 #14-80, Bogotá" }
      - { label: "Activo (se muestra en la página)", name: "activo", widget: "boolean", default: true, hint: "Desactívalo para ocultar un taller sin borrarlo" }
      - { label: "Notas internas (opcional, no se publica)", name: "body", widget: "markdown", required: false }

  - name: "productos"
    label: "Catálogo"
    folder: "src/content/productos"
    create: true
    slug: "{{slug}}"
    extension: "md"
    summary: "{{categoria}} — {{nombre}}"
    fields:
      - { label: "Nombre del producto", name: "nombre", widget: "string" }
      - label: "Categoría"
        name: "categoria"
        widget: "select"
        options:
          - { label: "Velas aromáticas", value: "velas-aromaticas" }
          - { label: "Bebidas frías", value: "bebidas-frias" }
          - { label: "Postres", value: "postres" }
          - { label: "Velas de intención", value: "velas-intencion" }
          - { label: "Varios", value: "varios" }
          - { label: "Recordatorios", value: "recordatorios" }
      - { label: "Descripción", name: "descripcion", widget: "text" }
      - { label: "Notas olfativas", name: "notasOlfativas", widget: "text", required: false }
      - { label: "Detalles técnicos", name: "detallesTecnicos", widget: "text", required: false }
      - { label: "Modo de uso / Cuidados", name: "modoDeUso", widget: "text", required: false }
      - label: "Precios (una fila por presentación/tamaño)"
        name: "variantes"
        widget: "list"
        fields:
          - { label: "Presentación", name: "presentacion", widget: "string", hint: "Ej: '220 ml', 'Ramo de 5 flores', 'Por cotización'" }
          - { label: "Precio (COP, solo el número, vacío si es 'por cotización')", name: "precio", widget: "number", value_type: "int", required: false }
      - { label: "Foto", name: "imagen", widget: "image", required: false, media_folder: "/public/images/productos", public_folder: "/images/productos" }
      - { label: "Destacado en el inicio", name: "destacado", widget: "boolean", default: false, hint: "Máximo unos pocos activados a la vez, se muestran en la home" }
      - { label: "Disponible (se muestra en /tienda)", name: "disponible", widget: "boolean", default: true, hint: "Desactívalo para ocultar sin borrar" }
