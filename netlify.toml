[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  # Los datos de precios se generan en el build (scripts/generar-datos-pago.mjs) como
  # módulos .js que las funciones importan, así que el bundler los mete solo — no hace
  # falta included_files.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
