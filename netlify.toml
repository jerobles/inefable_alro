[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  # Los .json de precios se generan en el build (ver scripts/generar-datos-pago.mjs) y
  # hay que forzar a que se empaqueten junto con las funciones que los leen.
  included_files = ["netlify/functions/data/*.json"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
